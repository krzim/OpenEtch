[package]
name = "webcore"
description = "In-browser core (WebAssembly, in a Web Worker): the display preview and its stats, Fill Region hover, and the design-only build's backend (the engine's document API in memory)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib for wasm-bindgen; rlib so the engine's parity tests and `cargo test -p webcore` run it natively.
crate-type = ["cdylib", "rlib"]

[features]
# Project and art thumbnails as PNG inside the core (resvg). Off: the worker shell rasterises the SVG.
png = ["appcore/png"]

[dependencies]
# The engine's document glue: the same JSON as the engine (tests/parity.rs).
appcore = { path = "../appcore" }
commands = { workspace = true }
doc = { workspace = true }
plan = { workspace = true }
lbrn = { workspace = true }
# Design devices (default features: no USB, no serial).
machine = { workspace = true }
# Legacy LightBurn templates (.lbt) for the shell's template check.
fileio = { path = "../fileio" }
geom = { path = "../geom" }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# Exactly the version in Cargo.lock: the wasm-bindgen CLI that generates the JS glue must match it
# (web/scripts/wasm.mjs checks).
wasm-bindgen = "=0.2.130"
# The backend's reply as a plain JS object (no serde-wasm-bindgen; MIT OR Apache-2.0, already in Cargo.lock).
js-sys = "=0.3.107"

[dev-dependencies]
# Fill Region parity: the engine's own `path.fill_region_preview` command.
# The parity test (tests/parity.rs) sends the same requests to the engine's router.
engine = { path = "../engine" }
machine = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
axum = { workspace = true }
# A small PNG for the image upload of the parity test.
image = { workspace = true }
