[package]
name = "webcore"
description = "In-browser core (WebAssembly, in a Web Worker): the display preview and its stats, Fill Region hover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib for wasm-bindgen; rlib so the engine's parity tests and `cargo test -p webcore` run it natively.
crate-type = ["cdylib", "rlib"]

[features]
# The design-only build's font and command entry points (src/design.rs): the whole command core and text.
design = ["dep:commands", "dep:text"]

[dependencies]
doc = { workspace = true }
plan = { workspace = true }
lbrn = { workspace = true }
geom = { path = "../geom" }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Exactly the version in Cargo.lock: the wasm-bindgen CLI that generates the JS glue must match it
# (web/scripts/wasm.mjs checks).
wasm-bindgen = "=0.2.130"
commands = { workspace = true, optional = true }
text = { workspace = true, optional = true }

[dev-dependencies]
# Fill Region parity: the engine's own `path.fill_region_preview` command.
commands = { workspace = true }
