[package]
name = "machine"
description = "Machine profile, Link transport trait, SimLink, UsbLink (nusb), Controller."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lmc = { workspace = true }
corfile = { workspace = true }
# The Ruida protocol layer, with its simulator and blocking UDP channel (std only).
ruida = { workspace = true, features = ["sim", "udp"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
nusb = { workspace = true, optional = true }
# Serial ports for GRBL (BSD-2-Clause OR Apache-2.0), feature `serial`.
serial2 = { workspace = true, optional = true }

[features]
usb = ["dep:nusb"]
serial = ["dep:serial2"]
