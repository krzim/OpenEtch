[package]
name = "engine"
description = "OpenEtch engine: HTTP/WebSocket API, MCP server, run approval."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "openetch"
path = "src/main.rs"

[features]
# Real hardware over USB (nusb). Without it the engine always drives the simulated board.
usb = ["machine/usb"]
# GRBL gantries over a real serial port (serial2). Without it a GRBL device runs only on the simulator.
serial = ["machine/serial"]
# UVC camera capture on the engine's computer (nokhwa); without it the camera takes frames uploaded by a browser.
camera = ["dep:nokhwa"]

[dependencies]
doc = { workspace = true }
commands = { workspace = true }
plan = { workspace = true }
machine = { workspace = true }
lmc = { workspace = true }
# Ruida `.rd` jobs (machine::ruida drives the controller).
ruida = { workspace = true }
corfile = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rmcp = { workspace = true }
resvg = { workspace = true }
base64 = { workspace = true }
schemars = { workspace = true }
# Material libraries (.clb) and LightBurn conversions.
lbrn = { workspace = true }
# Exports, imports, user bundles (zip) and image tools.
fileio = { path = "../fileio" }
# Camera frames and overlays, image bounds framing (pure Rust decoders).
image = { workspace = true }
# UVC capture (Apache-2.0), feature `camera`.
nokhwa = { version = "0.10", default-features = false, features = ["input-native"], optional = true }
# Bearer token generation (not in [workspace.dependencies]).
getrandom = "0.3"
# Operator PIN hash (not in [workspace.dependencies]).
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
