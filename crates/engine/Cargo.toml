[package]
name = "engine"
description = "galvo-studio engine: HTTP/WebSocket API, MCP server, run approval."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "galvo-studio"
path = "src/main.rs"

[features]
# Real hardware over USB (nusb). Without it the engine always drives the simulated board.
usb = ["machine/usb"]

[dependencies]
doc = { workspace = true }
commands = { workspace = true }
plan = { workspace = true }
machine = { workspace = true }
lmc = { workspace = true }
corfile = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rmcp = { workspace = true }
resvg = { workspace = true }
base64 = { workspace = true }
schemars = { workspace = true }
# Bearer token generation (not in [workspace.dependencies]).
getrandom = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
