[package]
name = "commands"
description = "Command registry, session, undo/redo and history"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
doc = { workspace = true }
geom = { path = "../geom" }
lbrn = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
kurbo = { workspace = true }
thiserror = { workspace = true }
usvg = { workspace = true }
base64 = { workspace = true }
text = { workspace = true }
# Files and image tools: exports, further imports, trace, rasterise; Save Processed Bitmap uses plan's dither.
fileio = { path = "../fileio" }
plan = { workspace = true }
roxmltree = { workspace = true }
# DXF reading (art.import_dxf, DXF jigs).
dxf = { workspace = true }

# Installed fonts, font folders and the clock for date/time variable text.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
text = { workspace = true, features = ["system"] }

# In the browser: the clock from JS `Date` (chrono's wasmbind), and a random source for the ids dxf makes (uuid's
# WebCrypto backend; wasm32-unknown-unknown has no other). Both MIT OR Apache-2.0, already in the tree natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
text = { workspace = true, features = ["wasm-clock"] }
uuid = { version = "1", default-features = false, features = ["js"] }

[dev-dependencies]
image = { workspace = true }
# .rd files for the art.import_rd tests.
ruida = { workspace = true }
