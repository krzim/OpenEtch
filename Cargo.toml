[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# internal
lmc = { path = "crates/lmc" }
corfile = { path = "crates/corfile" }
doc = { path = "crates/doc" }
commands = { path = "crates/commands" }
plan = { path = "crates/plan" }
machine = { path = "crates/machine" }
lbrn = { path = "crates/lbrn" }
text = { path = "crates/text" }

# shared
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
schemars = "1"
kurbo = { version = "0.13", features = ["serde"] }
toml = "0.9"
tracing = "0.1"

# geometry / import
usvg = { version = "0.49", default-features = false }
lyon_algorithms = "1"
i_overlay = "9.1"
# LightBurn .lbrn2 reading (writing is hand-written in crates/lbrn)
roxmltree = "0.21"
# DXF reading (art.import_dxf)
dxf = "0.6.2"
# image decoding for image engraving (plan; pure Rust decoders, wasm-ok)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }

# machine I/O
nusb = "0.2"
# GRBL serial ports (BSD-2-Clause OR Apache-2.0; not `serialport`, which is MPL-2.0)
serial2 = "0.2.39"

# engine
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.8", features = ["server", "macros", "transport-streamable-http-server"] }
resvg = { version = "0.49", default-features = false }
base64 = "0.22"
