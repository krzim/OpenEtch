# ComMarker B6 MOPA 60W (BJJCZ LMC board, USB 9588:9899, JPT M7 MOPA source, 150 mm lens).
#
# Sources:
# - markcfg7.ini (this machine's EzCad config, in this folder): field_mm (FIELDSIZE), swap_xy (GALVOX=1, read as
#   "galvo 1 = X": unverified), negate_x/negate_y (GALVONEGATE0/1: unverified axis order), cor_file (CORFILE
#   basename), red_light_speed_mm_s (REDLIGHTSPEED), frequency range (MINPWMFREQ/MAXPWMFREQ in Hz),
#   mark_speed (MINSPEED/MAXSPEED).
# - JPT M7 MOPA datasheet values: pulse_widths_ns, 1..4000 kHz.
# - Port bits: red pointer bit 8 and laser enable bit 0 (galvoplotter defaults; markcfg REDLIGHTOUTPORT=-1 means
#   EzCad's default red-light output). Not yet confirmed on this machine.
# - laser_on/laser_off/polygon delays: LightBurn's values for the B6, taken from a public B6 LightBurn log.
# - end delay, jump speed, jump delays: meerk40t/galvoplotter @ fc35136 defaults. jump_distance_limit_mm is a
#   placeholder (galvoplotter has no default).
# - max_jump_speed_mm_s: LightBurn's B6 library entry (JumpSpeed=4000). PROVISIONAL, not measured on this machine.
# - max_delay_us: PROVISIONAL sanity cap on |laser on/off/polygon/jump delay|, well above every value used here.
# - polygon_delay_us is sent as one 10 us word (meerk40t's encoding; galvoplotter disagrees). UNVERIFIED on hardware.
# - pulse_width_enabled, open_mo_delay_us: the owner's LightBurn device JCZFiber (Laser_QPulseWidthEnabled,
#   Laser_OpenMODelay). Informational. start_mark_input_bit: markcfg STARTMARKPORT=14 and LightBurn
#   StartMarkPortBit=14 (unverified what is wired to it).
# - motion_time_scale (time estimate only, nothing sent changes): the board's GetMarkTime after two runs on the owner's
#   machine (2026-11-01; words 1-2 = list time in 10 us units, matched by the wall clock) against the motion time the
#   list commands at the speeds its words give: a 30 x 30 mm fill at 1000 mm/s (600 lines, 18.04 s of motion, 0.25 s of
#   delays) took 23.568 s, 1.292x; an "F" of three outlines at 300 mm/s (0.576 s of motion, 0.010 s of delays) took
#   0.777 s, 1.33x (its jump path is not known exactly: ~35 mm more jumping would make it 1.29x too). A fixed cost per
#   line or per corner alone does not fit both (64 ms per line on the F, 8.8 ms on the fill); a small one (1-2 ms)
#   on top of the scale cannot be ruled out with two runs.
#   UNVERIFIED whether the board really moves slower than commanded (then the burn speed is ~77 % of the setting) or
#   only counts differently: the dot pitch of a line at 1000 mm/s and 1 kHz (1.0 mm commanded, ~0.77 mm if slower)
#   or timing the same job in EzCad would tell.

name = "ComMarker B6 MOPA 60W"
laser_source = "JPT M7 MOPA 60W"
field_mm = 153.75
swap_xy = true             # owner's B6, 2026-11-01: with false the red frame of an "F" came out transposed
negate_x = false
negate_y = false
cor_file = "jcz150.cor"
pulse_widths_ns = [2, 4, 6, 9, 13, 20, 30, 45, 55, 60, 80, 100, 150, 200, 250, 300, 350, 400, 450, 500]
frequency_khz_min = 1.0
frequency_khz_max = 4000.0
max_power_pct = 100.0
red_light_port_bit = 8
laser_enable_port_bit = 0
red_light_speed_mm_s = 3000.0
max_jump_speed_mm_s = 15000.0  # ComMarker's B6 rating: up to 15,000 mm/s
max_delay_us = 2000.0          # provisional sanity cap
pulse_width_enabled = true     # LightBurn Laser_QPulseWidthEnabled
open_mo_delay_us = 8000.0      # LightBurn Laser_OpenMODelay (informational)
motion_time_scale = 1.30       # time estimate only: the board took 1.29-1.33x the commanded motion time (see header)
start_mark_input_bit = 14      # markcfg STARTMARKPORT; on the owner's B6 (2026-11-01) input 14 reads 1 at rest and 0 while
                               # the foot switch is pressed (active low)
start_mark_active_low = true
notes = [
    "field, swap/negate, cor_file, red light speed, frequency range and mark speed limits from markcfg7.ini",
    "GALVOX / GALVONEGATE0/1 meaning unverified",
    "laser on/off/polygon delays from a public B6 LightBurn log",
    "red pointer bit 8 / laser enable bit 0 are galvoplotter defaults, unconfirmed on this machine",
    "jump_distance_limit_mm is a placeholder",
    "max_jump_speed_mm_s (LightBurn B6 JumpSpeed=4000) and max_delay_us are provisional",
    "polygon delay encoding (one 10 us word, meerk40t) is unverified on hardware",
    "motion_time_scale 1.30 fitted to two GetMarkTime readings (2026-11-01); whether the burn itself is slower is unverified",
]

[io]
# Door Protect: on the owner's B6 (2026-11-01) input 15 reads 1 while the door is open and 0 when it is closed.
door_protect = { bit = 15 }

[timing]
laser_on_delay_us = -300.0   # LightBurn B6 (public log)
laser_off_delay_us = 100.0   # LightBurn B6 (public log)
polygon_delay_us = 100.0     # LightBurn B6 (public log); sent as 10 x 10 us (unverified encoding)
end_delay_us = 300.0         # galvoplotter default
jump_speed_mm_s = 2000.0     # galvoplotter travel_speed default
jump_delay_min_us = 8.0      # galvoplotter delay_jump_short
jump_delay_max_us = 200.0    # galvoplotter delay_jump_long
jump_distance_limit_mm = 10.0  # placeholder

[mark_speed]
min_mm_s = 1.0       # markcfg7 MINSPEED
max_mm_s = 10000.0   # markcfg7 MAXSPEED
